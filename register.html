<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">注册</h3>
                    </div>
                    <div class="card-body">
                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" required minlength="3">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="registerBtn">注册</button>
                        </form>
                        <div id="message" class="mt-3 text-center"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化 Supabase 客户端
        const supabaseUrl = 'https://ndaihkkqwvvjbnlbygek.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kYWloa2txd3Z2amJubGJ5Z2VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4NjUwNDgsImV4cCI6MjA3ODQ0MTA0OH0.H0uJt-9dP2f-B9uNIOeD04jR4T5bwnJ5xr87egLkvkU';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 注册表单提交事件
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // 禁用注册按钮，避免重复提交
            const registerBtn = document.getElementById('registerBtn');
            registerBtn.disabled = true;
            registerBtn.textContent = '注册中...';

            try {
                // 将用户数据插入到 Supabase 数据库
                const { data, error } = await supabase
                    .from('users')
                    .insert([{ username, password }]);

                if (error) {
                    throw error;
                }

                // 注册成功
                document.getElementById('message').innerHTML = `
                    <div class="alert alert-success">注册成功！</div>
                `;
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            } catch (error) {
                // 注册失败
                document.getElementById('message').innerHTML = `
                    <div class="alert alert-danger">注册失败: ${error.message}</div>
                `;
            } finally {
                // 恢复注册按钮
                registerBtn.disabled = false;
                registerBtn.textContent = '注册';
            }
        });
    </script>
</body>
</html>
