<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-sha256@0.11.0/src/sha256.min.js"></script>
    <script>
        const supabaseUrl = 'https://ndaihkkqwvvjbnlbygek.supabase.co';
        const supabaseKey = 'sb_publishable_aVS25Xk44HIwBpgtrnRh3Q_r4HufwI_';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 生成唯一账户名（基于用户名和密码的哈希）
        function generateAccount(username, password) {
            const hash = sha256(username + password).substring(0, 12); // 取前12位作为账户名
            return `user_${hash}`;
        }

        // 检查账户是否重复
        async function checkAccount(account) {
            const { data, error } = await supabase
                .from('users')
                .select('account')
                .eq('account', account);

            if (error) {
                console.error('检查失败:', error.message);
                return false;
            } else if (data.length > 0) {
                return false; // 账户已存在
            } else {
                return true; // 账户可用
            }
        }

        // 注册逻辑
        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const account = generateAccount(username, password);

            // 显示生成的账户名
            document.getElementById('account').value = account;

            // 检查账户是否重复
            const isAccountValid = await checkAccount(account);
            if (!isAccountValid) {
                alert('账户名已存在，请重新输入用户名或密码！');
                return;
            }

            // 插入数据到 Supabase
            const { data, error } = await supabase
                .from('users')
                .insert([{ 
                    id: account, // 账户名作为唯一 ID
                    account: account,
                    username: username,
                    password: password 
                }]);

            if (error) {
                alert('注册失败: ' + error.message);
            } else {
                alert('注册成功！账户名: ' + account);
                window.location.href = 'login.html'; // 跳转到登录页面
            }
        }

        // 实时生成账户名
        function updateAccount() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username && password) {
                const account = generateAccount(username, password);
                document.getElementById('account').value = account;
            }
        }
    </script>
    <style>
        身体 {
            背景颜色: #f8f9fa;
        }
        .card {
            margin-top: 100px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            text-align: center;
        }
        .btn-primary {
            width: 100%;
        }
        .form-label {
            font-weight: bold;
        }
        #account {
            background-color: #f1f1f1;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>注册</h3>
                    </div>
                    <div class="card-body">
                        <form onsubmit="event.preventDefault(); register();">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" required oninput="updateAccount()">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" required oninput="updateAccount()">
                            </div>
                            <div class="mb-3">
                                <label for="account" class="form-label">账户名（自动生成）</label>
                                <input type="text" class="form-control" id="account" readonly>
                                <small class="text-muted">此账户名将作为唯一登录识别码。</small>
                            </div>
                            <button type="submit" class="btn btn-primary">注册</button>
                            <div class="text-center mt-3">
                                <a href="login.html" class="btn btn-link">已有账户？立即登录</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
