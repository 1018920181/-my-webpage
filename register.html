<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        const supabaseUrl = 'https://ndaihkkqwvvjbnlbygek.supabase.co';
        const supabaseKey = 'sb_publishable_aVS25Xk44HIwBpgtrnRh3Q_r4HufwI_';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function register() {
            console.log('注册函数被调用'); // 调试信息
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            console.log('用户名:', username, '密码:', password); // 调试信息

            const { data, error } = await supabase
                .from('users')
                .insert([{ username, password }]);

            console.log('插入结果:', data, '错误:', error); // 调试信息

            if (error) {
                alert('注册失败: ' + error.message);
            } else {
                alert('注册成功！');
                window.location.href = 'login.html';
            }
        }

        // 返回登录页面
        function returnToLogin() {
            window.location.href = 'login.html';
        }
    </script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            margin-top: 100px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            text-align: center;
        }
        .btn-primary {
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-secondary {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>注册</h3>
                    </div>
                    <div class="card-body">
                        <form onsubmit="event.preventDefault(); register();">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">注册</button>
                            <button type="button" class="btn btn-secondary" onclick="returnToLogin()">返回登录</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
