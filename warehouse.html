<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仓库管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            text-align: center;
        }
        .btn-primary {
            width: 100%;
        }
        .table {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">仓库管理系统</h1>
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>电子配件管理</h3>
                    </div>
                    <div 类="card-body">
                        <表单 id="添加部件表单">
                             
                                <label for="配件名称" class="form-label">配件名称</label>
                                <输入 类型="文本" 类="表单控制" id="部件名称" 必填>
                            </div>
                             
                                <label for="partModel" class="form-label">型号</label>
                                <input type="text" class="form-control" id="partModel" required>
                            </div>
                            <div class="mb-3">
                                <label for="partQuantity" class="form-label">数量</label>
                                <input type="number" class="form-control" id="partQuantity" required>
                            </div>
                            <div class="mb-3">
                                <label for="partImage" class="form-label">图片链接</label>
                                <input type="text" class="form-control" id="partImage">
                            </div>
                            <button type="submit" class="btn btn-primary">添加配件</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>整机管理</h3>
                    </div>
                    <div class="card-body">
                        <form id="addMachineForm">
                            <div class="mb-3">
                                <label for="machineName" class="form-label">整机名称</label>
                                <input type="text" class="form-control" id="machineName" required>
                            </div>
                            <button type="submit" class="btn btn-primary">添加整机</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-md-12">
                <h3>配件列表</h3>
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th>型号</th>
                            <th>数量</th>
                            <th>图片</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="partsTableBody">
                        <!-- 配件数据动态填充 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        const supabaseUrl = 'https://ndaihkkqwvvjbnlbygek.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kYWloa2txd3Z2amJubGJ5Z2VrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4NjUwNDgsImV4cCI6MjA3ODQ0MTA0OH0.H0uJt-9dP2f-B9uNIOeD04jR4T5bwnJ5xr87egLkvkU';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 添加配件
        document.getElementById('addPartForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('partName').value;
            const model = document.getElementById('partModel').value;
            const quantity = parseInt(document.getElementById('partQuantity').value);
            const imageUrl = document.getElementById('partImage').value;

            const { data, error } = await supabase
                .from('parts')
                .insert([{ name, model, quantity, image_url: imageUrl }]);

            if (error) {
                alert('添加配件失败: ' + error.message);
            } else {
                alert('配件添加成功！');
                fetchParts();
            }
        });

        // 添加整机
        document.getElementById('addMachineForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('machineName').value;

            const { data, error } = await supabase
                .from('machines')
                .insert([{ name }]);

            if (error) {
                alert('添加整机失败: ' + error.message);
            } else {
                alert('整机添加成功！');
                fetchMachines();
            }
        });

        // 获取并显示配件列表
        async function fetchParts() {
            const { data, error } = await supabase.from('parts').select('*');
            if (error) {
                console.error('获取配件列表失败:', error);
            } else {
                const tbody = document.getElementById('partsTableBody');
                tbody.innerHTML = data.map(part => `
                    <tr>
                        <td>${part.name}</td>
                        <td>${part.model}</td>
                        <td>${part.quantity}</td>
                        <td><img src="${part.image_url}" width="50" height="50"></td>
                        <td>
                            <button class="btn btn-sm btn-warning" onclick="editPart('${part.id}')">编辑</button>
                            <button class="btn btn-sm btn-danger" onclick="deletePart('${part.id}')">删除</button>
                        </td>
                    </tr>
                `).join('');
            }
        }

        // 初始化页面时加载配件列表
        fetchParts();
    </script>
</body>

</html>
