<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        const supabaseUrl = 'https://ndaihkkqwvvjbnlbygek.supabase.co';
        const supabaseKey = 'sb_publishable_aVS25Xk44HIwBpgtrnRh3Q_r4HufwI_';
        const supabase = supabase.createClient(https://ndaihkkqwvvjbnlbygek.supabase.co,sb_publishable_aVS25Xk44HIwBpgtrnRh3Q_r4HufwI_);

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabase
                .from('users')
                .select('*')
                .eq('username', username)
                .eq('password', password);

            if (error || data.length === 0) {
                alert('登录失败: 用户名或密码错误');
            } else {
                window.location.href = 'warehouse.html'; // 跳转到仓库管理页面
            }
        }
    </script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            margin-top: 100px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background-color: #007bff;
            color: white;
            text-align: center;
        }
        .btn-primary {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>登录</h3>
                    </div>
                    <div class="card-body">
                        <form onsubmit="event.preventDefault(); login();">
                            <div class="mb-3">
                                <label for="username" class="form-label">用户名</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">密码</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">登录</button>
                        </form>
                        <div class="mt-3 text-center">
                            <a href="register.html">没有账号？立即注册</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
